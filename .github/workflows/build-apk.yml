name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Cari proyek lengkap
        id: p
        run: |
          ok=""
          for f in $(find . -name settings.gradle.kts -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -f "$d/app/build.gradle.kts" ]; then ok="$d"; break; fi
          done
          if [ -z "$ok" ]; then
            z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$z" ]; then
              echo "Memakai zip: $z"
              mkdir -p _src && unzip -q -o "$z" -d _src
              for f in $(find _src -name settings.gradle.kts); do
                d=$(dirname "$f")
                if [ -f "$d/app/build.gradle.kts" ]; then ok="$d"; break; fi
              done
            fi
          fi
          if [ -z "$ok" ]; then
            echo "Proyek lengkap tidak ditemukan. Isi repository:"
            find . -type f -not -path './.git/*' | sort
            exit 1
          fi
          echo "Proyek: $ok"
          echo "dir=$ok" >> "$GITHUB_OUTPUT"
      - name: Buat keystore jika belum ada
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          if [ ! -f app/enhancer.jks ]; then
            keytool -genkeypair -keystore app/enhancer.jks -storepass enhancer123 -keypass enhancer123 -alias enhancer -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Video Enhancer"
          fi
      - name: Build release APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" VideoEnhancer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoEnhancer-apk
          path: VideoEnhancer.apk
      - name: Publish release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoEnhancer.apk
