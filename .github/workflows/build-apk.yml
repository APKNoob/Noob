name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Cari folder proyek
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "Ditemukan: $f"
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ada di repository"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" VideoEnhancer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoEnhancer-apk
          path: VideoEnhancer.apk
      - name: Publish release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoEnhancer.apk
